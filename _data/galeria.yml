# GALERÍA DE FOTOS Y VIDEOS
# Cada elemento empieza con un guion. Copia un bloque, pégalo arriba y cambia los datos.
#
# Para una FOTO: sube la imagen a la carpeta galeria y escribe:
# - tipo: "foto"
#   archivo: "/galeria/nombre-de-la-foto.jpg"
#   titulo: "Presentación en la Feria del Libro"
#   fecha: "2026-07-20"            (opcional)
#   descripcion: "Texto breve"      (opcional)
#
# Para un VIDEO DE YOUTUBE: copia el código que aparece después de "watch?v=" en el enlace
# - tipo: "video"
#   youtube: "5RN82l5wHlI"
#   titulo: "Título del video"
#
# Para un VIDEO PROPIO (archivo .mp4 subido a la carpeta galeria, máximo unos 25 MB):
# - tipo: "video"
#   archivo: "/galeria/mi-video.mp4"
#   titulo: "Título del video"

- tipo: "video"
  youtube: "5RN82l5wHlI"
